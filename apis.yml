aid: drivio
name: Drivio
description: >-
  Drivio (Drivio Technologies Pvt Ltd) is a tech-enabled, omni-channel
  two-wheeler financing marketplace in India that connects motorcycle, scooter,
  and electric-vehicle buyers with banks and NBFCs. Founded in 2022 by Saurabh
  Tripathi and Ankur Bhardwaj and headquartered in the Delhi NCR region
  (Gurugram / New Delhi), the platform offers EMI calculators, instant
  eligibility checks, curated finance offers, vehicle comparison, and same-day
  loan approval and disbursal through lending partners including IDFC First
  Bank, Bajaj Auto Credit, L&T Financial Services, HDB Financial Services,
  Moneyplus Financial Services, and Arthmate. Drivio is an ISO/IEC 27001
  certified company and is backed by 500 Global.
